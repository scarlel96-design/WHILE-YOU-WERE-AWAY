name: Schema5 Persistence Repair

on:
  push:
    paths:
      - ".github/workflows/schema5-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair schema 5 persistence boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact schema 5 repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          narrative = Path("src/main/java/io/github/whileaway/NarrativeData.java")
          text = narrative.read_text(encoding="utf-8")
          count = text.count("getLOng")
          if count != 3:
              raise SystemExit(f"expected exactly 3 getLOng typos, found {count}")
          narrative.write_text(text.replace("getLOng", "getLong"), encoding="utf-8")

          storage = Path("src/main/java/io/github/whileaway/StoryStorage.java")
          text = storage.read_text(encoding="utf-8")
          old = '            if(format==5&&!root.contains("returnNetwork",Tag.TAG_COMPOUND))throw new IllegalStateException("field=returnNetwork missing_or_wrong_type");'
          new = '''            if(format<5&&root.contains("returnNetwork"))
                throw new IllegalStateException("field=returnNetwork incompatible_format");
            if(format==5&&root.contains("returnNetwork")) {
                if(!root.contains("returnNetwork",Tag.TAG_COMPOUND))
                    throw new IllegalStateException("field=returnNetwork missing_or_wrong_type");
                var network=root.getCompound("returnNetwork");
                if(!network.contains("schema",Tag.TAG_INT)||network.getInt("schema")<=0)
                    throw new IllegalStateException("field=returnNetwork.schema missing_or_invalid");
                if(network.getInt("schema")>1) {
                    failure=Outcome.UNSUPPORTED;
                    throw new IllegalStateException("field=returnNetwork.schema unsupported_version");
                }
            }'''
          if text.count(old) != 1:
              raise SystemExit("StoryStorage schema5 admission anchor not found exactly once")
          storage.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/schema5-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair schema 5 persistence boundary"
          git push origin HEAD:master
