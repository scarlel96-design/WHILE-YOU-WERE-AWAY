name: Windows Compatibility CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master
      - dev

    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/windows-validation.yml"

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows Build + GameTest
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Python 확인
        shell: pwsh
        run: |
          python --version

      - name: Java 확인
        shell: pwsh
        run: |
          java -version

      - name: Gradle wrapper 확인
        shell: pwsh
        run: |
          .\gradlew.bat --version

      - name: CI evidence 폴더 생성
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            evidence\ci-windows `
            | Out-Null

      - name: Design Contract 검사
        id: design
        shell: pwsh
        run: |
          python tools\verify-design-contract.py

      - name: Windows Gradle Build
        id: build
        shell: pwsh
        run: |
          .\gradlew.bat `
            build `
            --no-daemon `
            --console=plain `
            2>&1 |
            Tee-Object `
              evidence\ci-windows\gradle-build.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Windows GameTest
        id: gametest
        shell: pwsh
        run: |
          .\gradlew.bat `
            runGameTestServer `
            --no-daemon `
            --console=plain `
            2>&1 |
            Tee-Object `
              evidence\ci-windows\gametest.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: JAR SHA-256
        if: always()
        shell: pwsh
        run: |
          $jar = Get-ChildItem build\libs\*.jar |
            Where-Object {
              $_.Name -notmatch '-sources\.jar$' -and
              $_.Name -notmatch '-javadoc\.jar$'
            } |
            Select-Object -First 1

          if ($null -ne $jar) {
            $hash = Get-FileHash `
              $jar.FullName `
              -Algorithm SHA256

            @"
          name=$($jar.Name)
          sha256=$($hash.Hash.ToLower())
          size=$($jar.Length)
          "@ |
              Set-Content `
                evidence\ci-windows\jar.txt `
                -Encoding utf8
          }
          else {
            "JAR NOT AVAILABLE" |
              Set-Content `
                evidence\ci-windows\jar.txt `
                -Encoding utf8
          }

      - name: Windows CI metadata
        if: always()
        shell: pwsh
        run: |
          @"
          commit=$env:GITHUB_SHA
          ref=$env:GITHUB_REF
          run_id=$env:GITHUB_RUN_ID
          run_number=$env:GITHUB_RUN_NUMBER
          runner=$env:RUNNER_OS
          java=21
          real_client=NOT_TESTED
          "@ |
            Set-Content `
              evidence\ci-windows\run.txt `
              -Encoding utf8

      - name: Windows 증거 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhileAway-Windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/ci-windows/**
            build/reports/**
            build/libs/*.jar
