name: Minecraft GameTest CI
on:
  push: {branches: [master, dev]}
  pull_request: {branches: [master, dev]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: gametest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare
        run: |
          mkdir -p evidence/ci/status
          java -version 2>&1 | tee evidence/ci/java-version.txt
          echo 'REAL CLIENT = NOT TESTED' > evidence/ci/real-client.txt
      - name: JSON
        id: json
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          while IFS= read -r -d '' f; do python3 -m json.tool "$f" >/dev/null || exit 1; done < <(find . \( -path './.git' -o -path './.gradle' -o -path './build' -o -path './run' -o -path './runs' \) -prune -o -type f -name '*.json' -print0)
      - name: Design
        id: design
        if: always()
        continue-on-error: true
        run: python3 tools/verify-design-contract.py 2>&1 | tee evidence/ci/design.log
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew build --no-daemon --console=plain 2>&1 | tee evidence/ci/build.log
      - name: GameTest
        id: gametest
        if: always()
        continue-on-error: true
        run: ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee evidence/ci/gradle-gametest.log
      - name: JAR
        id: jar
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          JAR="$(find build/libs -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -1)"
          test -n "$JAR"
          echo "$JAR" > evidence/ci/final-jar.txt
          sha256sum "$JAR" | tee evidence/ci/jar.sha256
      - name: Assets
        id: asset
        if: always()
        continue-on-error: true
        run: python3 tools/verify-assets.py "$(cat evidence/ci/final-jar.txt)" 2>&1 | tee evidence/ci/assets.log
      - name: Audio
        id: audio
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 -c 'import numpy,soundfile' 2>/dev/null || python3 -m pip install numpy soundfile || true
          if python3 -c 'import numpy,soundfile' 2>/dev/null; then python3 tools/verify-audio.py 2>&1 | tee evidence/ci/audio.log; else echo SKIPPED | tee evidence/ci/audio.log; fi
      - name: Summary
        if: always()
        env:
          JSON: ${{ steps.json.outcome }}
          DESIGN: ${{ steps.design.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GAMETEST: ${{ steps.gametest.outcome }}
          ASSET: ${{ steps.asset.outcome }}
          AUDIO: ${{ steps.audio.outcome }}
        run: |
          python3 -c "import os,pathlib; d=pathlib.Path('evidence/ci/status'); d.mkdir(parents=True,exist_ok=True); [(d/k).write_text({'success':'PASS','failure':'FAIL','skipped':'SKIPPED'}.get(os.environ[k.upper()],'SKIPPED')) for k in ('json','design','build','gametest','asset','audio')]"
          python3 tools/ci/write-summary.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            evidence/ci/**
            evidence/return-network-contract/**
            build/reports/**
            build/test-results/**
            build/libs/*.jar
      - name: Gate
        if: always()
        run: python3 -c "import json; x=json.load(open('evidence/ci/summary.json')); raise SystemExit(x['overall']!='CI PASS')"
