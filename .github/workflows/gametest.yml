name: Minecraft GameTest CI

on:
  push:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 래퍼 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 및 GameTest 실행
        run: ./gradlew build runGameTestServer --no-daemon
